approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: pnpm

npmMinimalAgeGate: 0

packageExtensions:
  # plotly.js imports it in scattergl traces without declaring it
  plotly.js@*:
    dependencies:
      "@plotly/point-cluster": ^3.1.9
  # its bundle.js inlines @plotly/point-cluster, including that package's imports
  regl-scatter2d@*:
    dependencies:
      array-bounds: ^1.0.1

yarnPath: .yarn/releases/yarn-4.18.1.cjs
